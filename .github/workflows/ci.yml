name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: semcache
          POSTGRES_PASSWORD: semcache_dev_only
          POSTGRES_DB: semcache
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semcache -d semcache"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://semcache:semcache_dev_only@127.0.0.1:5432/semcache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Unit tests (Bedrock mocked, no Docker)
        run: uv run pytest
      - name: Postgres + pgvector contract tests
        run: uv run pytest -m db
      - name: Dataset is valid
        run: uv run semcache dataset validate
