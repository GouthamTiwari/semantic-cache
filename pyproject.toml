[project]
name = "semcache"
version = "0.1.0"
description = "Embedding-similarity cache for LLM calls with scoped isolation, safety guards and a measured false-hit rate. Python, Amazon Bedrock, pgvector."
readme = "README.md"
license = "MIT"
authors = [{ name = "Goutham Tiwari", email = "227244284+GouthamTiwari@users.noreply.github.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.44.4",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pgvector>=0.5.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
semcache = "semcache.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
# uv's own build backend: it understands the src/ layout with no extra config.
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: real errors, I: import order, UP: modern Python syntax, B: common bug patterns.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Plain `uv run pytest` must be free and need no Docker, so the two costly groups are opt-in.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
addopts = '-m "not live and not db"'
markers = [
    "live: calls real Amazon Bedrock, costs money",
    "db: needs the Docker Postgres (docker compose up -d)",
]
