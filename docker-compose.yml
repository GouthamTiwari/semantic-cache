# Postgres 16 + pgvector for the semantic cache, plus the optional API service.
#   docker compose up -d                     -> database only (for tests and local runs)
#   docker compose --profile app up -d       -> database + API on http://127.0.0.1:8000
# Host port 5434, so it does not clash with other local Postgres containers on 5432/5433.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: semcache-db
    environment:
      POSTGRES_USER: semcache
      POSTGRES_PASSWORD: semcache_dev_only   # local dev only, never reuse anywhere real
      POSTGRES_DB: semcache
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - semcache_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semcache -d semcache"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    container_name: semcache-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://semcache:semcache_dev_only@db:5432/semcache
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  semcache_pgdata:
